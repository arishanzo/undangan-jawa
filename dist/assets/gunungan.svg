<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7a1e" />
      <stop offset="100%" stop-color="#ffd859" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#996515" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd859" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Gunungan Outline / Shape -->
  <g filter="url(#shadow)">
    <!-- Base leaf shape of Gunungan -->
    <path d="M 100,10 
             C 115,45 155,75 175,130 
             C 195,185 185,245 155,275 
             C 140,290 120,295 105,295 
             L 105,315 L 95,315 L 95,295 
             C 80,295 60,290 45,275 
             C 15,245 5,185 25,130 
             C 45,75 85,45 100,10 Z" 
          fill="url(#glowGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="3" />

    <!-- Inner decorative border line -->
    <path d="M 100,22 
             C 112,52 148,80 166,132 
             C 183,182 173,237 146,265 
             C 133,278 116,283 100,283 
             C 84,283 67,278 54,265 
             C 27,237 17,182 34,132 
             C 52,80 88,52 100,22 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="1.5" 
          stroke-dasharray="4,2" />

    <!-- Central Sacred Tree of Life (Pohon Hayat) -->
    <!-- Trunk -->
    <path d="M 97,280 L 97,120 Q 97,110 100,90 Q 103,110 103,120 L 103,280 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Branches Left -->
    <path d="M 97,200 C 70,195 50,170 55,145 C 60,125 78,135 97,165" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 97,170 C 80,155 65,130 75,105 C 83,88 95,115 98,135" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 98,130 C 85,110 75,85 88,65 C 96,55 100,80 100,95" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Branches Right -->
    <path d="M 103,200 C 130,195 150,170 145,145 C 140,125 122,135 103,165" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 103,170 C 120,155 135,130 125,105 C 117,88 105,115 102,135" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 102,130 C 115,110 125,85 112,65 C 104,55 100,80 100,95" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sacred Gate / Gapura Paduraksa at bottom -->
    <path d="M 75,280 L 75,230 L 85,220 L 100,205 L 115,220 L 125,230 L 125,280 Z" 
          fill="#1e1510" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Gate Door dividing line -->
    <line x1="100" y1="210" x2="100" y2="280" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="94" cy="245" r="2" fill="url(#goldGrad)"/>
    <circle cx="106" cy="245" r="2" fill="url(#goldGrad)"/>

    <!-- Mythical Wing Elements / Kala / Garuda Wings -->
    <path d="M 40,210 Q 55,230 75,240 Q 60,245 42,225 Z" fill="url(#goldGrad)"/>
    <path d="M 160,210 Q 145,230 125,240 Q 140,245 158,225 Z" fill="url(#goldGrad)"/>
    <path d="M 30,175 Q 48,195 68,200 Q 50,210 32,190 Z" fill="url(#goldGrad)"/>
    <path d="M 170,175 Q 152,195 132,200 Q 150,210 168,190 Z" fill="url(#goldGrad)"/>

    <!-- Top Crown Jewel / Mustika -->
    <circle cx="100" cy="18" r="4.5" fill="#fff" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="100" cy="35" r="3" fill="url(#goldGrad)"/>
    <circle cx="100" cy="50" r="2.5" fill="url(#goldGrad)"/>
  </g>
</svg>
